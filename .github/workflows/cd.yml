# ==========================================
# CD - Tự động deploy lên VPS .174 sau khi push vào main
# ==========================================
# Vì sao dùng self-hosted runner: máy .174 chỉ có IP nội bộ (192.168.59.174) nên
# GitHub Actions trên cloud KHÔNG SSH vào được. Runner cài trên chính .174 sẽ tự
# "kéo" job về qua HTTPS ra ngoài (outbound), không cần mở port hay IP public.
#
# Cách cài runner: xem deploy/setup-github-runner.ps1 và deploy/README.md mục 8.
#
# Phạm vi CD (theo quyết định vận hành): CHỈ cập nhật code + restart service.
# KHÔNG chạy migration, KHÔNG seed — mọi thay đổi database do người vận hành
# chủ động thực hiện, tránh việc một lần push vô tình đụng dữ liệu đang phục vụ.

name: CD

on:
  # Chỉ deploy sau khi CI đã xanh trên nhánh main -> không đẩy code lỗi lên server.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Cho phép bấm deploy thủ công từ tab Actions.
  workflow_dispatch:

# Không cho 2 lần deploy chạy song song (tránh 2 tiến trình cùng ghi vào thư mục app).
concurrency:
  group: deploy-hustcrm
  cancel-in-progress: false

jobs:
  deploy:
    # Chỉ chạy khi CI thành công (hoặc khi bấm tay).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: [self-hosted, windows, hustcrm]

    env:
      APP_DIR: C:\inetpub\wwwroot\hustcrm.jvs.com.vn\app
      # node_modules (~347MB, phần lớn là Prisma engine) nằm NGOÀI site folder;
      # service trỏ tới đây qua biến NODE_PATH. Document root chỉ còn ~1.3MB.
      RUNTIME_DIR: C:\apps\hustcrm-runtime
      SERVICE_NAME: hustcrm
      NSSM: C:\apps\tools\nssm.exe
      APP_PORT: '3090'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build production
        run: npm run build

      # Dừng service trước khi ghi đè file: Windows khoá file đang được tiến trình dùng.
      - name: Dừng service
        shell: powershell
        run: |
          & $env:NSSM stop $env:SERVICE_NAME
          Start-Sleep -Seconds 4

      # Xoá dist cũ để không còn file js/css của bản build trước (tên có hash).
      - name: Cập nhật code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "$env:APP_DIR\dist") { Remove-Item "$env:APP_DIR\dist" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$env:APP_DIR\dist" | Out-Null
          Copy-Item -Path "dist\*" -Destination "$env:APP_DIR\dist" -Recurse -Force
          Copy-Item -Path "package.json" -Destination "$env:APP_DIR\package.json" -Force
          Copy-Item -Path "prisma" -Destination "$env:APP_DIR" -Recurse -Force

      # package.json có thể thêm dependency mới -> cài lại (chỉ prod) và sinh lại Prisma
      # client. Chạy trong RUNTIME_DIR để node_modules không nằm dưới document root.
      - name: Cài dependencies production trên server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:RUNTIME_DIR | Out-Null
          Copy-Item "$env:APP_DIR\package.json" "$env:RUNTIME_DIR\package.json" -Force
          if (Test-Path "$env:RUNTIME_DIR\prisma") { Remove-Item "$env:RUNTIME_DIR\prisma" -Recurse -Force }
          Copy-Item "$env:APP_DIR\prisma" $env:RUNTIME_DIR -Recurse -Force
          Set-Location $env:RUNTIME_DIR
          npm install --omit=dev --no-audit --no-fund
          npx prisma generate
          npm cache clean --force
          # Dọn nếu lần deploy cũ còn node_modules trong site folder.
          $stale = Join-Path $env:APP_DIR 'node_modules'
          if (Test-Path $stale) {
            Remove-Item $stale -Recurse -Force
            Write-Host "Đã dọn node_modules cũ trong site folder"
          }

      - name: Khởi động service
        shell: powershell
        run: |
          & $env:NSSM start $env:SERVICE_NAME
          Start-Sleep -Seconds 6
          $status = (Get-Service $env:SERVICE_NAME).Status
          Write-Host "Service status: $status"
          if ($status -ne 'Running') { throw "Service $env:SERVICE_NAME không chạy được" }

      # Kiểm sức khoẻ THẬT: nếu app không trả 200 thì fail và in log để chẩn đoán,
      # không báo "deploy thành công" trên một app đã chết.
      - name: Kiểm tra app trả lời
        shell: powershell
        run: |
          $ok = $false
          foreach ($i in 1..6) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$env:APP_PORT/" -UseBasicParsing -TimeoutSec 15
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Write-Host "Lần thử ${i}: chưa trả lời, chờ 5s..."
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) {
            Write-Host "--- app.err.log (30 dòng cuối) ---"
            $logPath = 'C:\inetpub\wwwroot\hustcrm.jvs.com.vn\logs\app.err.log'
            if (Test-Path $logPath) { Get-Content $logPath -Tail 30 }
            throw "App không trả HTTP 200 trên cổng $env:APP_PORT"
          }
          Write-Host "App trả HTTP 200 - deploy thành công."

      - name: Kết quả
        shell: powershell
        run: |
          Write-Host "Đã deploy https://hustcrm.jvs.com.vn (commit ${{ github.sha }})"
          Write-Host "Lưu ý: CD không chạy migration/seed. Nếu bản này có migration mới,"
          Write-Host "hãy chạy tay: npx prisma migrate deploy (trong $env:APP_DIR)"
